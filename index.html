<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Quote Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Weather & Quote Dashboard</h1>
            <p>Check current weather and get daily inspiration</p>
        </header>

        <section class="card">
        <h2><div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter any city"
            >
            <select id="cityDropdown">

                <option value="">Popular Cities</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Mysore">Mysore</option>
                <option value="Mangalore">Mangalore</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi">Delhi</option>
                <option value="Chennai">Chennai</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Kolkata">Kolkata</option>
                <option value="London">London</option>
                <option value="Dubai">Dubai</option>
                <option value="Singapore">Singapore</option>
            </select>

            <button id="weatherBtn">
                Get Weather
            </button>

        </div></h2>

        <div class="weather-result">

            <h3>Weather Details</h3>
            <p id="temperature">Temperature: --</p>
            <p id="condition">Condition: --</p>
            <p id="humidity">Humidity: --</p>
            <p id="wind">Wind Speed: --</p>

        </div>
        </section>

        <section class="card">
            <h2>Daily Inspiration</h2>
            <div class="quote-box">
                <p class="quote">
                    Click below to receive a motivational quote.
                </p>

                <button>
                    Get New Quote
                </button>
            </div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
